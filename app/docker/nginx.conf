server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # La app usa rutas con # (#/analisis), así que todo sale de index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Estos deben revisarse siempre: si quedan guardados, el celular no ve la versión nueva
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Los archivos de assets/ llevan un código en el nombre que cambia con cada versión
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
