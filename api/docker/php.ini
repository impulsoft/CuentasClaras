; Ajustes de PHP para el servidor

; Fotos de comprobantes y del cuaderno: hasta 8 MB (ver ComprobanteController y CuadernoController)
upload_max_filesize = 10M
post_max_size = 12M

; Leer una foto puede tardar hasta 30 s esperando al OCR (OCR_ESPERA_SEGUNDOS)
max_execution_time = 60
memory_limit = 256M

expose_php = Off
display_errors = Off
log_errors = On

; El código no cambia dentro del contenedor: no hace falta revisar los archivos en cada pedido
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
