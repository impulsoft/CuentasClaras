<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Laravel necesita su public/.htaccess para las rutas
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # Las fotos llegan de hasta 8 MB
    LimitRequestBody 12582912
</VirtualHost>
